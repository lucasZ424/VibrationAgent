[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibration-agent"
version = "0.0.1"
description = "Engineering-oriented vibration learning & knowledge-base agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "PyMuPDF>=1.24.7,<2.0.0",
    "Pillow>=10.3.0,<12.0.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.0.0,<4.0.0",
    "paddlepaddle>=3.0.0,<4.0.0",
    "pytesseract>=0.3.10,<1.0.0",
]
dev = [
    "pytest>=8.3.2,<9.0.0",
]
all = [
    "paddleocr>=3.0.0,<4.0.0",
    "paddlepaddle>=3.0.0,<4.0.0",
    "pytesseract>=0.3.10,<1.0.0",
    "pytest>=8.3.2,<9.0.0",
]

[project.scripts]
vib-agent = "apps.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
