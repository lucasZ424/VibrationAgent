classify:
  ocr_text_density_threshold: 0.2   # chars per 1000 PDF pt^2; sparse text layer below this is treated as scanned

ocr:
  primary: paddleocr
  fallback: tesseract
  render_dpi: 220
  paddleocr:
    lang: ch
    use_angle_cls: true
  tesseract:
    langs: chi_sim+eng+osd
  fallback_triggers:
    - low_confidence_below: 0.6
    - empty_output
    - key_evidence_page
    - scan_heavy_page

chunking:
  target_tokens: 600
  overlap_tokens: 60
  preserve_anchors: true           # never split across a section boundary without recording it

visual_recovery:
  enabled: true
  region_ocr_enabled: false       # optional figure metadata enrichment; keep off for bulk native ingestion
  direct_image_min_dimension: 4.0
  grid_cell_size: 4.0
  min_cluster_blocks: 20
  min_cluster_dimension: 40.0
  min_cluster_area_ratio: 0.01
  scanned_text_ceiling: 15
  scanned_meaningful_block_ceiling: 8
  scanned_largest_region_ratio: 0.50
  scanned_occupancy_ratio: 0.65
  retained_cluster_limit: 16
  hard_cluster_limit: 24
  region_ocr_limit: 4
  direct_asset_limit: 100

indexing:
  embedding_model: bge-m3          # placeholder
  batch_size: 64
