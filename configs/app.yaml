app:
  name: vibration-agent
  log_level: INFO
  default_user_mode: engineering      # engineering | definition | derivation | research

orchestrator:
  phase0_pipeline: [s2_retrieval, s3_qa_summary, v2_citation_check, v4_style]
  high_risk_checks: [v3_reviewer]   # deferred: activated for flagged answers

routing:
  default_owner: gpt
  opus_difficulties: [extreme]
  repeated_failure_threshold: 2
  explicit_extreme_markers: [extreme, opus, senior_supervisor]

llm:
  s3_enabled: false
  s3_timeout: 10.0
  providers:
    interaction_main: openai:gpt-5.5
    task_router: openai:gpt-5.5
    executor: openai:gpt-5.5
    senior_planner: anthropic:claude-opus
    senior_reviewer: anthropic:claude-opus
    emergency_owner: anthropic:claude-opus
    main_answer: openai:gpt-5.5
    coder: openai:gpt-5.5
    reviewer: anthropic:claude-opus
    citation_checker: openai:gpt-5.5
