mode: hybrid                       # bm25 | dense | hybrid
independent_lanes_enabled: true    # promoted after Obj4 retrieval + full RAG/V2 gates
top_k:
  bm25: 50
  dense: 50
  final: 10

fusion:
  method: rrf                      # rrf | weighted
  weights:
    bm25: 0.4
    dense: 0.6

rerank:
  enabled: false                   # turn on after phase-0 wiring is working
  model: null

evidence_selection:
  enabled: false                   # Obj5 candidate; promote only after completeness/V2 gate
  seed_chunks: 10
  max_chunks: 12
  token_budget: 6000
  adjacent_window: 1

source_priority:                   # ties broken by rank; multiplier applied pre-rerank
  standard: 5
  textbook: 4
  review: 3
  paper: 2
  webpage: 1
