llm:
  replay_dir: tests/fixtures/llm
  s4_enabled: false
  capture_enabled: false
  live_enabled: false
  token_budget_per_task: 4000
  token_budget_per_session: 30000
  usd_budget_per_task: null
  openai:
    model: gpt-5.5
    api_key_env: OPENAI_API_KEY
    temperature: 0.0
    max_tokens: 1024
    timeout: 30.0
    reasoning_effort: high
    text_verbosity: high
    input_usd_per_million_tokens: 5.0
    output_usd_per_million_tokens: 30.0
    cached_input_usd_per_million_tokens: 0.5
  anthropic:
    model: claude-opus-4-8
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0.0
    max_tokens: 1024
    timeout: 30.0
    input_usd_per_million_tokens: 5.0
    output_usd_per_million_tokens: 25.0
    cached_input_usd_per_million_tokens: 0.5
